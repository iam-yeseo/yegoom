<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>내 프로필 · 예굼방 아케이드 🎮</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      내 프로필
      <span id="subtitle">&nbsp;</span>
    </h1>

    <section class="card">
      <div class="card__label">프로필 사진</div>

      <div class="photo-row">
        <div class="photo-preview" id="photo-preview" aria-hidden="true">🙂</div>
        <div class="photo-actions">
          <button id="photo-pick" class="btn" type="button">앨범에서 사진 고르기</button>
          <button id="photo-remove" class="btn btn--ghost hidden" type="button">사진 지우기</button>
        </div>
      </div>
      <input id="photo-file" class="photo-file" type="file"
             accept="image/png, image/jpeg, image/webp, image/heic, image/heif, image/*"
             aria-label="프로필 사진 파일" />
      <p class="muted" style="font-size: 13px; margin: 0">
        고른 사진은 정방형(1:1)으로 잘라서 넣습니다. 사진을 지우면 아래 프로필 글자가 대신 보여요.
      </p>
    </section>

    <section class="card">
      <div class="card__label">닉네임 · 프로필 글자</div>

      <div class="profile-preview">
        <div class="profile-preview__avatar" id="preview-avatar" aria-hidden="true">🙂</div>
        <div>
          <div class="profile-preview__name" id="preview-name">&nbsp;</div>
          <div class="muted" style="font-size: 13px">참가자 목록에 이렇게 보여요</div>
        </div>
      </div>

      <form id="profile-form">
        <label class="field">
          <span>닉네임 · 한글/영문/숫자 10글자 이내</span>
          <input id="nickname" type="text" maxlength="10" autocomplete="nickname"
                 inputmode="text" required />
        </label>

        <label class="field">
          <span>프로필 글자 · 한 글자 (사진이 없을 때 보여요)</span>
          <input id="avatar" class="avatar-input" type="text" maxlength="8" required />
        </label>

        <div class="chips chips--emoji" id="emoji-picks"></div>

        <button class="btn" type="submit" style="margin-top: 12px">프로필 저장</button>
      </form>
    </section>

    <section class="card">
      <div class="card__label">비밀번호 변경</div>
      <form id="pw-form">
        <label class="field">
          <span>현재 비밀번호</span>
          <input id="current" type="password" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span>새 비밀번호 (3자 이상)</span>
          <input id="next" type="password" autocomplete="new-password" minlength="3" required />
        </label>
        <button class="btn btn--ghost" type="submit">비밀번호 변경</button>
      </form>
    </section>

    <section class="card">
      <button id="logout" class="btn btn--ghost" type="button">로그아웃</button>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      api, avatarOf, playOnce, renderTabbar, requireLogin, revealChildren, roleLabel,
      setHidden, setHtml, startClock,
    } from '/js/common.js';
    import { confirmDialog, showToast } from '/js/ui.js';
    import { pickSquarePhoto } from '/js/photo-picker.js';

    const EMOJI_PICKS = ['🐣', '🐤', '🐥', '🦊', '🐼', '🐧', '🍀', '⭐', '🔥', '🌙', '🍜', '🕕'];
    const NICKNAME_RE = /^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9]+$/u;

    const el = {
      subtitle: document.getElementById('subtitle'),
      previewAvatar: document.getElementById('preview-avatar'),
      previewName: document.getElementById('preview-name'),
      nickname: document.getElementById('nickname'),
      avatar: document.getElementById('avatar'),
      picks: document.getElementById('emoji-picks'),
      profileForm: document.getElementById('profile-form'),
      photoPreview: document.getElementById('photo-preview'),
      photoPick: document.getElementById('photo-pick'),
      photoRemove: document.getElementById('photo-remove'),
      photoFile: document.getElementById('photo-file'),
    };

    startClock();
    const user = await requireLogin();
    renderTabbar(user);
    // 첫 화면만 위 칸부터 차례로 올라온다
    revealChildren(document.querySelector('.app'));

    /** 이모지 한 개는 1글자로 센다 */
    const segmenter = 'Segmenter' in Intl
      ? new Intl.Segmenter('ko', { granularity: 'grapheme' })
      : null;

    function graphemes(text) {
      return segmenter ? [...segmenter.segment(text)].map((s) => s.segment) : [...text];
    }

    el.subtitle.textContent = `${user.username} · ${roleLabel(user)}`;
    el.nickname.value = user.displayName;
    el.avatar.value = user.avatar ?? '🙂';

    // 지금 프로필 사진 (없으면 null)
    let photoUrl = user.photoUrl ?? null;
    syncPreview();

    setHtml(el.picks, EMOJI_PICKS.map(
      (e) => `<button class="chip" type="button" data-emoji="${e}">${e}</button>`,
    ).join(''));
    el.picks.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      el.avatar.value = chip.dataset.emoji;
      playOnce(chip, 'is-picked');
      syncPreview();
    });

    el.nickname.addEventListener('input', syncPreview);
    el.avatar.addEventListener('input', syncPreview);

    function syncPreview() {
      const letter = graphemes(el.avatar.value.trim())[0] ?? '🙂';
      const person = { avatar: letter, photoUrl, displayName: el.nickname.value.trim() };

      setHtml(el.photoPreview, avatarOf(person));
      setHidden(el.photoRemove, !photoUrl);
      el.photoPick.textContent = photoUrl ? '다른 사진으로 바꾸기' : '앨범에서 사진 고르기';

      // 목록 미리보기 — 사진이 있으면 사진이, 없으면 프로필 글자가 보인다
      setHtml(el.previewAvatar, avatarOf(person));
      el.previewName.textContent = el.nickname.value.trim() || '닉네임';
      for (const chip of el.picks.querySelectorAll('.chip')) {
        chip.setAttribute('aria-pressed', String(chip.dataset.emoji === el.avatar.value.trim()));
      }
    }

    /* ---------------- 프로필 사진 ---------------- */

    // 버튼으로 파일 선택창을 대신 연다 (모바일에서는 앨범이 바로 열린다)
    el.photoPick.addEventListener('click', () => el.photoFile.click());

    el.photoFile.addEventListener('change', async () => {
      const file = el.photoFile.files?.[0];
      // 같은 사진을 다시 골라도 change 가 오도록 값을 비워 둔다
      el.photoFile.value = '';
      if (!file) return;

      let dataUrl;
      try {
        dataUrl = await pickSquarePhoto(file);   // 정방형으로 자르는 화면
      } catch (err) {
        return showToast(err.message, 'error');
      }
      if (!dataUrl) return;                      // 자르기를 취소했다

      await savePhoto(dataUrl, '프로필 사진을 저장했어요.');
    });

    el.photoRemove.addEventListener('click', async () => {
      const ok = await confirmDialog({
        icon: '🗑️',
        title: '프로필 사진을 지울까요?',
        message: '사진을 지우면 프로필 글자가 대신 보이게 돼요.',
        confirmText: '지우기',
        tone: 'danger',
      });
      if (!ok) return;
      await savePhoto(null, '프로필 사진을 지웠어요.');
    });

    async function savePhoto(photo, okMessage) {
      const buttons = [el.photoPick, el.photoRemove];
      for (const b of buttons) b.disabled = true;
      const label = el.photoPick.textContent;
      el.photoPick.textContent = photo ? '저장 중…' : '지우는 중…';
      try {
        const res = await api('/api/profile', { method: 'POST', body: { photo } });
        photoUrl = res.user.photoUrl ?? null;
        syncPreview();
        showToast(okMessage, 'ok');
      } catch (err) {
        showToast(err.message, 'error');
        el.photoPick.textContent = label;
      } finally {
        for (const b of buttons) b.disabled = false;
      }
    }

    el.profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      // 맥/iOS 에서 붙여넣은 한글은 자모가 분리돼 올 수 있어 서버와 같게 NFC 로 맞춘다
      const displayName = el.nickname.value.normalize('NFC').trim();
      const avatar = el.avatar.value.normalize('NFC').trim();

      // 서버에서도 같은 규칙으로 검사하지만, 먼저 알려 주면 덜 답답하다
      if (!NICKNAME_RE.test(displayName)) {
        return showToast('닉네임은 한글, 영문, 숫자만 쓸 수 있어요.', 'error');
      }
      if (graphemes(displayName).length > 10) {
        return showToast('닉네임은 10글자까지 가능해요.', 'error');
      }
      if (graphemes(avatar).length !== 1) {
        return showToast('프로필 글자는 딱 한 글자만 넣을 수 있어요.', 'error');
      }

      try {
        const res = await api('/api/profile', { method: 'POST', body: { displayName, avatar } });
        el.nickname.value = res.user.displayName;
        el.avatar.value = res.user.avatar;
        photoUrl = res.user.photoUrl ?? null;
        syncPreview();
        showToast('프로필을 저장했어요.', 'ok');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await api('/api/password', {
          method: 'POST',
          body: {
            currentPassword: document.getElementById('current').value,
            newPassword: document.getElementById('next').value,
          },
        });
        showToast(res.message, 'ok');
        setTimeout(() => location.replace('/login'), 1500);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await api('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/login');
    });
  </script>
</body>
</html>
