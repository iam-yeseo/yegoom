<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>내 계정 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      내 계정
      <span id="subtitle">&nbsp;</span>
    </h1>

    <p id="msg" class="msg hidden" role="alert"></p>

    <section class="card">
      <div class="card__label">비밀번호 변경</div>
      <form id="pw-form">
        <label class="field">
          <span>현재 비밀번호</span>
          <input id="current" type="password" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span>새 비밀번호 (4자 이상)</span>
          <input id="next" type="password" autocomplete="new-password" minlength="4" required />
        </label>
        <button class="btn" type="submit">비밀번호 변경</button>
      </form>
    </section>

    <section class="card">
      <button id="logout" class="btn btn--ghost" type="button">로그아웃</button>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import { api, escapeHtml, renderTabbar, requireLogin, showMessage, startClock } from '/js/common.js';

    startClock();
    const user = await requireLogin();
    renderTabbar(user);

    document.getElementById('subtitle').textContent =
      `${user.displayName} · ${user.username} · ${user.role === 'admin' ? '운영자' : '플레이어'}`;

    document.getElementById('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      showMessage(msg, '');
      try {
        const res = await api('/api/password', {
          method: 'POST',
          body: {
            currentPassword: document.getElementById('current').value,
            newPassword: document.getElementById('next').value,
          },
        });
        showMessage(msg, res.message, 'ok');
        setTimeout(() => location.replace('/login'), 1200);
      } catch (err) {
        showMessage(msg, err.message);
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await api('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/login');
    });
  </script>
</body>
</html>
