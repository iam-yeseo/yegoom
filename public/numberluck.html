<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9eb" />
  <title>숫자 고르기 · 예굼방 아케이드 🎮</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/arcade.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/arcade/icon-cat.svg" />
</head>
<body data-party="numberluck">
  <main class="app">
    <header class="gnb" data-gnb aria-label="내 프로필과 점수"></header>
    <h1 class="page-title">🃏 숫자 고르기<span>겹치지 않는 가장 큰 숫자를 골라요</span></h1>
    <section class="card" id="party-info"><p>게임을 불러오는 중이에요.</p></section>
    <section class="card hidden" id="party-play"></section>
    <details class="game-rules"><summary>게임 규칙 & 배점 ⌄</summary>
      <p class="muted">2명이 하고 싶어요를 누르면 시작해요. 3명 이상 준비 완료하면 30초 뒤 공개해요.
      공개 전까지 추가로 참여할 수 있어요. 공개 시 준비를 마친 사람만 이번 회차에 참여해요.</p>
      <p class="muted" id="party-rules"></p>
    </details>
    <section class="card"><h2 class="card__label">지난 회차</h2><div id="party-history"></div></section>
  </main>
  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>
  <script type="module" src="/js/game-entry.js"></script>
</body>
</html>
