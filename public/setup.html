<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <meta name="robots" content="noindex" />
  <title>초기 설정 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <main class="auth">
    <div class="auth__logo" aria-hidden="true">🛠️</div>
    <h1 class="auth__title">초기 설정</h1>
    <p class="auth__sub">테이블과 계정을 준비하고, 출제자를 지정하는 운영자 페이지입니다.</p>

    <p id="msg" class="msg hidden" role="status"></p>

    <section class="card">
      <div class="card__label">상태</div>
      <div id="status"><div class="skeleton"></div></div>
      <button id="run" class="btn hidden" type="button" style="margin-top: 14px">
        초기 설정 실행
      </button>
      <a id="go" class="btn btn--ghost hidden" href="/login" style="margin-top: 14px">
        로그인하러 가기
      </a>
    </section>

    <section class="card">
      <div class="card__label">출제자 지정</div>
      <p class="muted" style="margin: 0 0 12px; font-size: 14px">
        출제자의 퇴근시간이 그날의 정답이 됩니다. 출제자 본인은 예측을 낼 수 없고
        랭킹에도 들어가지 않습니다. 운영자로 로그인해야 보입니다.
      </p>
      <div id="setter-list"><div class="skeleton"></div></div>
    </section>

    <section class="card">
      <div class="card__label">스키마 업데이트</div>
      <p class="muted" style="margin: 0 0 12px; font-size: 14px">
        예전 버전으로 만든 데이터베이스를 지금 모양으로 옮깁니다. 기록은 그대로
        옮겨지고, 이미 최신이면 아무 일도 일어나지 않습니다.
        운영자로 로그인했거나 설정 토큰이 있어야 실행됩니다.
      </p>
      <p id="migrate-state" class="msg hidden" style="margin: 0 0 12px"></p>
      <button id="migrate" class="btn btn--ghost" type="button">스키마 업데이트 실행</button>
    </section>

    <p class="center muted" style="font-size: 13px">
      초기 설정은 계정이 하나라도 생기면 스스로 닫힙니다.
    </p>
  </main>

  <script type="module">
    import { api, avatarOf, escapeHtml, showMessage } from '/js/common.js';

    const el = {
      msg: document.getElementById('msg'),
      status: document.getElementById('status'),
      run: document.getElementById('run'),
      go: document.getElementById('go'),
      migrate: document.getElementById('migrate'),
      migrateState: document.getElementById('migrate-state'),
      setterList: document.getElementById('setter-list'),
    };

    // SETUP_TOKEN 을 걸어 뒀다면 /setup?token=... 으로 들어온다
    const token = new URLSearchParams(location.search).get('token');

    function renderUsers(users) {
      return users
        .map(
          (u) => `<div class="player">
            <div class="player__avatar" aria-hidden="true">${avatarOf(u)}</div>
            <div class="player__body">
              <div class="player__name">${escapeHtml(u.displayName)}</div>
              <div class="player__meta">${escapeHtml(u.username)} · ${
                u.role === 'admin' ? '운영자' : u.isSetter ? '출제자' : '플레이어'
              }</div>
            </div>
          </div>`,
        )
        .join('');
    }

    /** 출제자 후보 목록 — 운영자로 로그인했을 때만 내려온다 */
    async function refreshSetter() {
      let data;
      try {
        data = await api('/api/admin/setter');
      } catch (err) {
        el.setterList.innerHTML = `<p class="muted center" style="margin:0">${
          err.status === 401 || err.status === 403
            ? '운영자로 로그인하면 여기서 출제자를 바꿀 수 있어요.'
            : escapeHtml(err.message)
        }</p>`;
        return;
      }

      el.setterList.innerHTML = data.candidates.length
        ? data.candidates
            .map(
              (u) => `<div class="player">
                <div class="player__avatar" aria-hidden="true">${avatarOf(u)}</div>
                <div class="player__body">
                  <div class="player__name">${escapeHtml(u.displayName)}${
                    u.isSetter ? '<span class="tag tag--win">출제자</span>' : ''
                  }</div>
                  <div class="player__meta">${escapeHtml(u.username)}</div>
                </div>
                <button class="chip" type="button" data-setter="${u.id}"${
                  u.isSetter ? ' disabled' : ''
                }>${u.isSetter ? '지정됨' : '출제자로'}</button>
              </div>`,
            )
            .join('')
        : '<p class="muted center" style="margin:0">지정할 수 있는 참가자가 없어요.</p>';
    }

    el.setterList.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-setter]');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      showMessage(el.msg, '');
      try {
        const res = await api('/api/admin/setter', {
          method: 'POST',
          body: { userId: Number(btn.dataset.setter) },
        });
        showMessage(el.msg, `${res.setter.displayName} 님을 출제자로 지정했어요.`, 'ok');
      } catch (err) {
        showMessage(el.msg, err.message);
      }
      await refreshSetter().catch(() => {});
    });

    async function refresh() {
      const s = await api('/api/bootstrap');

      // 배포만 하고 스키마를 안 옮기면 admin 계정이 없어 로그인이 막힌다.
      // 남은 게 있으면 눈에 띄게 알려 준다.
      const pending = s.pendingMigration ?? [];
      if (pending.length) {
        const needsAdmin = pending.includes('users.admin-account');
        showMessage(
          el.migrateState,
          `업데이트가 필요합니다 (${pending.join(', ')}).` +
            (needsAdmin ? ' 실행하면 운영자 계정 admin 이 만들어집니다.' : ''),
          'error',
        );
        el.migrate.classList.remove('btn--ghost');
      } else if (s.ready) {
        showMessage(el.migrateState, '이미 최신 스키마입니다.', 'ok');
        el.migrate.classList.add('btn--ghost');
      } else {
        showMessage(el.migrateState, '');
      }

      if (s.ready) {
        el.status.innerHTML =
          `<p style="margin:0 0 10px">설정이 끝났습니다. 계정 ${s.userCount}개가 있습니다.</p>` +
          renderUsers(s.users);
        el.run.classList.add('hidden');
        el.go.classList.remove('hidden');
      } else {
        el.status.innerHTML =
          '<p class="muted" style="margin:0">아직 설정 전입니다. 아래 버튼을 눌러 주세요.</p>';
        el.run.classList.remove('hidden');
        el.go.classList.add('hidden');
      }
      return s;
    }

    el.run.addEventListener('click', async () => {
      el.run.disabled = true;
      el.run.textContent = '설정 중…';
      showMessage(el.msg, '');
      try {
        const path = token ? `/api/bootstrap?token=${encodeURIComponent(token)}` : '/api/bootstrap';
        const res = await api(path, { method: 'POST' });
        showMessage(el.msg, `계정 ${res.userCount}개를 만들었습니다.`, 'ok');
        await refresh();
        await refreshSetter().catch(() => {});
      } catch (err) {
        showMessage(el.msg, err.message);
        el.run.disabled = false;
        el.run.textContent = '초기 설정 실행';
        await refresh().catch(() => {});
      }
    });

    el.migrate.addEventListener('click', async () => {
      el.migrate.disabled = true;
      el.migrate.textContent = '업데이트 중…';
      showMessage(el.msg, '');
      try {
        const path = token ? `/api/migrate?token=${encodeURIComponent(token)}` : '/api/migrate';
        const res = await api(path, { method: 'POST' });
        showMessage(
          el.msg,
          res.migrated
            ? `옮긴 항목: ${res.applied.join(', ')}.` +
                (res.applied.includes('users.admin-account')
                  ? ' 이제 admin / admin 으로 로그인하세요.'
                  : '')
            : '이미 최신 스키마입니다.',
          'ok',
        );
        await refresh().catch(() => {});
        await refreshSetter().catch(() => {});
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.migrate.disabled = false;
        el.migrate.textContent = '스키마 업데이트 실행';
      }
    });

    try {
      await refresh();
    } catch (err) {
      showMessage(el.msg, `상태를 확인하지 못했습니다: ${err.message}`);
      el.status.innerHTML = '<p class="muted" style="margin:0">D1 바인딩을 확인해 주세요.</p>';
    }

    await refreshSetter().catch(() => {});
  </script>
</body>
</html>
