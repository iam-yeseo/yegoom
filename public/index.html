<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>오늘의 게임 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      오늘의 퇴근시간
      <span id="subtitle">불러오는 중…</span>
    </h1>

    <p id="msg" class="msg hidden" role="status"></p>

    <!-- 정답 공개 영역 -->
    <section id="answer-box" class="answer hidden">
      <div class="answer__label">오늘의 정답</div>
      <div class="answer__time" id="answer-time">--:--</div>
      <div class="muted" id="answer-note"></div>
    </section>

    <!-- 예측 입력 (플레이어 전용) -->
    <section id="guess-box" class="card hidden">
      <div class="card__label">내 예측</div>
      <input id="guess-input" class="time-input" type="time" step="60" value="18:00"
             aria-label="예측 퇴근시간" />
      <div class="chips" id="chips"></div>
      <button id="guess-submit" class="btn" type="button" style="margin-top: 12px">
        예측 제출하기
      </button>
      <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
        정답이 공개되기 전까지 몇 번이든 바꿀 수 있어요.
      </p>
    </section>

    <!-- 운영자 안내 -->
    <section id="admin-box" class="card hidden">
      <div class="card__label">운영자</div>
      <p style="margin: 0 0 12px">
        플레이어들의 예측은 정답을 공개하기 전까지 아무에게도 보이지 않습니다.
      </p>
      <a class="btn" href="/admin">오늘의 정답 등록하러 가기</a>
    </section>

    <!-- 플레이어 현황 -->
    <section class="card">
      <div class="card__label" id="players-label">참가자</div>
      <div id="players">
        <div class="skeleton"></div>
        <div class="skeleton" style="width: 70%"></div>
        <div class="skeleton" style="width: 85%"></div>
      </div>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      api, escapeHtml, initial, renderTabbar, requireLogin, showMessage, startClock,
    } from '/js/common.js';

    const QUICK_PICKS = ['17:30', '18:00', '18:30', '19:00', '20:00', '21:00'];

    const el = {
      subtitle: document.getElementById('subtitle'),
      msg: document.getElementById('msg'),
      answerBox: document.getElementById('answer-box'),
      answerTime: document.getElementById('answer-time'),
      answerNote: document.getElementById('answer-note'),
      guessBox: document.getElementById('guess-box'),
      guessInput: document.getElementById('guess-input'),
      guessSubmit: document.getElementById('guess-submit'),
      chips: document.getElementById('chips'),
      adminBox: document.getElementById('admin-box'),
      players: document.getElementById('players'),
      playersLabel: document.getElementById('players-label'),
    };

    startClock();
    const user = await requireLogin();
    renderTabbar(user);

    // 빠른 선택 칩
    el.chips.innerHTML = QUICK_PICKS.map(
      (t) => `<button class="chip" type="button" data-time="${t}" aria-pressed="false">${t}</button>`,
    ).join('');
    el.chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      el.guessInput.value = chip.dataset.time;
      syncChips();
    });
    el.guessInput.addEventListener('input', syncChips);

    function syncChips() {
      for (const chip of el.chips.querySelectorAll('.chip')) {
        chip.setAttribute('aria-pressed', String(chip.dataset.time === el.guessInput.value));
      }
    }

    el.guessSubmit.addEventListener('click', async () => {
      const time = el.guessInput.value;
      if (!time) return showMessage(el.msg, '예측할 시간을 골라 주세요.');

      el.guessSubmit.disabled = true;
      el.guessSubmit.textContent = '제출 중…';
      try {
        await api('/api/guess', { method: 'POST', body: { time } });
        showMessage(el.msg, `${time} 로 예측을 제출했어요.`, 'ok');
        await load();
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.guessSubmit.disabled = false;
      }
    });

    async function load() {
      const state = await api('/api/today');
      const isPlayer = user.role === 'player';

      // 헤더 문구
      if (state.revealed) {
        const winners = state.players.filter((p) => p.isWinner);
        el.subtitle.textContent = winners.length
          ? `오늘의 우승 · ${winners.map((w) => w.displayName).join(', ')}`
          : '정답이 공개됐어요 (참가자 없음)';
      } else {
        const done = state.players.filter((p) => p.submitted).length;
        el.subtitle.textContent = `정답 공개 대기 중 · ${done}/${state.players.length}명 제출`;
      }

      // 정답 카드
      el.answerBox.classList.toggle('hidden', !state.revealed);
      if (state.revealed) {
        el.answerTime.textContent = state.answer;
        const me = state.players.find((p) => p.isMe);
        el.answerNote.textContent = me?.diffText
          ? `내 예측 ${me.guess} · ${me.diffText}`
          : '';
      }

      // 입력 카드 / 운영자 카드
      el.guessBox.classList.toggle('hidden', !isPlayer || state.revealed);
      el.adminBox.classList.toggle('hidden', user.role !== 'admin' || state.revealed);

      if (isPlayer && !state.revealed) {
        if (state.myGuess) {
          el.guessInput.value = state.myGuess;
          el.guessSubmit.textContent = '예측 수정하기';
        } else {
          el.guessSubmit.textContent = '예측 제출하기';
        }
        syncChips();
      }

      // 참가자 목록
      el.playersLabel.textContent = state.revealed ? '결과' : '참가자';
      el.players.innerHTML = state.players
        .map((p) => {
          const winner = p.isWinner ? ' player--winner' : '';
          const tags =
            (p.isMe ? '<span class="tag tag--me">나</span>' : '') +
            (p.isWinner ? '<span class="tag tag--win">우승 🏆</span>' : '');

          let meta;
          if (state.revealed) meta = p.submitted ? p.diffText : '예측 없음';
          else if (p.submitted) meta = p.isMe ? `내 예측 ${p.guess}` : '제출 완료 🔒';
          else meta = '아직 제출 전';

          const value = state.revealed || p.isMe ? (p.guess ?? '—') : '···';

          return `<div class="player${winner}">
            <div class="player__avatar" aria-hidden="true">${initial(p.displayName)}</div>
            <div class="player__body">
              <div class="player__name">${escapeHtml(p.displayName)}${tags}</div>
              <div class="player__meta">${escapeHtml(meta)} · 누적 ${p.totalWins}승</div>
            </div>
            <div class="player__value">${escapeHtml(value)}</div>
          </div>`;
        })
        .join('');
    }

    await load();
    // 다른 참가자의 제출이나 정답 공개를 반영하기 위해 주기적으로 새로고침
    setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 20000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) load().catch(() => {});
    });
  </script>
</body>
</html>
