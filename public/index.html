<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>기상 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>" />
</head>
<body>
  <!-- 첫 화면은 지금 시간에 맞는 게임으로 보낸다.
       세 게임 모두 하단 탭바에 있으니 언제든 다른 쪽으로 넘어갈 수 있다. -->
  <main class="auth">
    <div class="auth__logo" aria-hidden="true">⏱️</div>
    <h1 class="auth__title">기상 · 퇴근시간 맞히기</h1>
    <p class="auth__sub" id="note">게임으로 이동하고 있어요…</p>
    <div class="btn-row">
      <a class="btn btn--ghost" href="/morning">🌅 오전</a>
      <a class="btn btn--ghost" href="/evening">🌆 오후</a>
      <a class="btn btn--ghost" href="/quiz">🧠 퀴즈</a>
    </div>
  </main>

  <script type="module">
    import { GAMES, currentGameKey } from '/js/common.js';

    const game = GAMES[currentGameKey()];
    document.getElementById('note').textContent = `${game.label}으로 이동하고 있어요…`;
    location.replace(game.path);
  </script>
</body>
</html>
