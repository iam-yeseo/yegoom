<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>랭킹 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      누적 랭킹
      <span>점수 합계 순 · 동점이면 정확히 맞힌 횟수, 그다음 평균 오차 순</span>
    </h1>

    <section class="card">
      <div class="card__label">순위</div>
      <div id="ranking">
        <div class="skeleton"></div>
        <div class="skeleton" style="width: 75%"></div>
        <div class="skeleton" style="width: 88%"></div>
      </div>
    </section>

    <section class="card">
      <div class="card__label">지난 회차</div>
      <div id="history"><div class="skeleton"></div></div>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      api, avatarOf, escapeHtml, formatShortDate, renderTabbar, requireLogin, roundLabel, startClock,
    } from '/js/common.js';

    const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };

    startClock();
    const user = await requireLogin();
    renderTabbar(user);

    function renderRanking(ranking) {
      return ranking.length
        ? ranking
            .map((r) => {
              const me = r.id === user.id ? '<span class="tag tag--me">나</span>' : '';
              const meta = r.played
                ? `${r.played}회차 참가 · 정확 ${r.exacts}회 · 1등 ${r.wins}회 · 평균 ${r.avgDiffText}`
                : '아직 참가 기록이 없어요';
              return `<div class="rank">
                <div class="rank__medal">${MEDALS[r.rank] ?? r.rank}</div>
                <div class="rank__avatar" aria-hidden="true">${avatarOf(r)}</div>
                <div class="rank__body">
                  <div class="rank__name">${escapeHtml(r.displayName)} ${me}</div>
                  <div class="rank__meta">${escapeHtml(meta)}</div>
                </div>
                <div class="rank__wins"><b>${r.score}</b><span>점</span></div>
              </div>`;
            })
            .join('')
        : '<p class="muted center">아직 등록된 플레이어가 없어요.</p>';
    }

    function renderHistory(history) {
      return history.length
        ? history
            .map((h) => {
              const voided = h.status !== 'settled';
              const head = voided ? '게임 없음' : escapeHtml(roundLabel(h.roundNo));
              const setter = h.setter
                ? ` · 출제 ${escapeHtml(`${h.setter.avatar} ${h.setter.displayName}`)}`
                : '';
              const top = h.entries
                .filter((e) => e.isWinner)
                .map((e) => `${e.avatar} ${e.displayName}`);
              const scored = h.entries
                .filter((e) => e.score > 0)
                .map((e) => `${e.displayName} ${e.scoreText}`);

              return `<div class="history-item${voided ? ' history-item--void' : ''}">
                <div class="history-item__head">
                  <span class="history-item__date">
                    ${escapeHtml(formatShortDate(h.date))} · ${head}${setter}
                  </span>
                  <span class="history-item__answer">${voided ? '—' : escapeHtml(h.answer)}</span>
                </div>
                <div class="history-item__winners">${
                  voided
                    ? '정답이 등록되지 않아 회차로 세지 않았어요.'
                    : top.length
                      ? `🏆 ${escapeHtml(top.join(', '))}${
                          scored.length ? ` · ${escapeHtml(scored.join(' / '))}` : ''
                        }`
                      : '참가자 없음'
                }</div>
              </div>`;
            })
            .join('')
        : '<p class="muted center">아직 끝난 회차가 없어요.</p>';
    }

    // 네트워크가 끊겨도 스켈레톤만 남지 않도록 실패를 화면에 보여 준다
    try {
      const [{ ranking }, { history }] = await Promise.all([
        api('/api/ranking'),
        api('/api/history'),
      ]);
      document.getElementById('ranking').innerHTML = renderRanking(ranking);
      document.getElementById('history').innerHTML = renderHistory(history);
    } catch (err) {
      const msg = `<p class="muted center">불러오지 못했습니다.<br />${escapeHtml(err.message)}</p>`;
      document.getElementById('ranking').innerHTML = msg;
      document.getElementById('history').innerHTML = msg;
    }
  </script>
</body>
</html>
