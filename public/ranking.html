<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9eb" />
  <title>랭킹 · 예굼방 아케이드 🎮</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/arcade.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/arcade/icon-cat.svg" />
</head>
<body>
  <div class="app">
    <header class="gnb" data-gnb aria-label="내 프로필과 점수"></header>

    <h1 class="page-title">
      예굼방 명예의 전당
      <span id="subtitle">다섯 게임의 점수를 모두 합쳐서 셉니다.</span>
    </h1>

    <section id="my-rank" aria-live="polite"></section>

    <!-- 다섯 게임을 합쳐서, 또는 한 게임만 따로 볼 수 있다 -->
    <div class="segmented" role="tablist" aria-label="게임 고르기" id="scope">
      <button class="segmented__item" type="button" role="tab" data-scope="" aria-selected="true">
        전체
      </button>
      <button class="segmented__item" type="button" role="tab" data-scope="morning"
              aria-selected="false">기상</button>
      <button class="segmented__item" type="button" role="tab" data-scope="evening"
              aria-selected="false">퇴근</button>
      <button class="segmented__item" type="button" role="tab" data-scope="quiz"
              aria-selected="false">퀴즈</button>
      <button class="segmented__item" type="button" role="tab" data-scope="catchmind" aria-selected="false">독심술사</button>
      <button class="segmented__item" type="button" role="tab" data-scope="numberluck" aria-selected="false">숫자</button>
    </div>

    <section class="card">
      <div class="card__label" id="ranking-label">순위</div>
      <div id="ranking">
        <div class="skeleton"></div>
        <div class="skeleton" style="width: 75%"></div>
        <div class="skeleton" style="width: 88%"></div>
      </div>
    </section>

    <section class="card">
      <div class="card__label" id="history-label">지난 회차</div>
      <div id="history"><div class="skeleton"></div></div>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      GAMES, QUIZ, api, avatarOf, escapeHtml, formatShortDate, personChip, playOnce,
      renderTabbar, requireLogin, revealChildren, roundLabel, setHtml,
    } from '/js/common.js';

    import { illustration, stateArt } from '/js/arcade.js';
    import { renderPartyHistory } from '/js/party-history.js';
    const PARTY = { catchmind: {label:'독심술사'},numberluck:{label:'숫자 고르기'} };
    const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };

    const el = {
      subtitle: document.getElementById('subtitle'),
      scope: document.getElementById('scope'),
      rankingLabel: document.getElementById('ranking-label'),
      ranking: document.getElementById('ranking'),
      historyLabel: document.getElementById('history-label'),
      history: document.getElementById('history'),
    };


    const user = await requireLogin();
    renderTabbar(user);

    let scope = '';   // '' 이면 다섯 게임 합산

    /*
     * 무엇을 크게 보여 줄지가 보기 방식마다 다르다.
     *
     *   전체    총점 하나 — 그 아래에 게임별로 얼마씩 벌었는지만 적는다
     *   게임별  그 게임의 우승 횟수 — 점수와 정확도는 아래 줄로 내린다
     *
     * 순위를 매기는 기준은 어느 쪽이든 점수 합계다 (서버가 그렇게 정렬해 내려 준다).
     * 그래서 게임별로 볼 때도 아래 줄에 점수를 남겨 둔다 — 그게 이 순서의 근거다.
     */

    /** 전체 합산 — 어느 게임에서 얼마를 벌었는지 */
    function totalMeta(r) {
      return `🌅 ${r.morningScore}점 / 🌆 ${r.eveningScore}점 / 🧠 ${r.quizScore}점 / 🔮 ${r.catchmindScore}점 / 🃏 ${r.numberluckScore}점`;
    }

    /** 오전 · 오후 한 게임만 — 그 게임에서 번 점수와 정확도 */
    function timeMeta(r) {
      if (!r.played) return '아직 참가 기록이 없어요';
      return `${r.score}점 · 정확 ${r.exacts}회 · 평균 ${r.avgDiffText}`;
    }

    /** 퀴즈만 — 시간 맞히기와 세는 것이 다르다 (평균 오차라는 게 없다) */
    function quizMeta(r) {
      if (!r.played) return '아직 참가 기록이 없어요';
      const parts = [`${r.score}점`, `맞힌 ${r.solved}회`];
      if (r.made) parts.push(`출제 ${r.made}회`);
      if (r.hintsUsed) parts.push(`힌트 ${r.hintsUsed}회`);
      return parts.join(' · ');
    }

    /** 오른쪽 큰 숫자 — 전체는 총점, 게임별은 우승 횟수 */
    function rankValue(r) {
      if (!scope || PARTY[scope]) return { number: r.score, unit: '점' };
      // 퀴즈에서 우승은 '가장 먼저 맞힌' 것이다
      return { number: scope === QUIZ.key ? r.firsts : r.wins, unit: '회' };
    }

    function renderRanking(ranking) {
      if (!ranking.length) return stateArt('empty','첫 기록의 주인공은?','아직 등록된 플레이어가 없어요.');

      return ranking
        .map((r) => {
          const me = r.id === user.id ? '<span class="tag tag--me">나</span>' : '';
          const meta = !scope ? totalMeta(r) : PARTY[scope] ? `참가 ${r.played}회 · ${r.score}점` : scope === QUIZ.key ? quizMeta(r) : timeMeta(r);
          const value = rankValue(r);
          return `<div class="rank">
            <div class="rank__medal">${MEDALS[r.rank] ?? r.rank}</div>
            <div class="rank__avatar" aria-hidden="true">${avatarOf(r)}</div>
            <div class="rank__body">
              <div class="rank__name">${escapeHtml(r.displayName)} ${me}</div>
              <div class="rank__meta">${escapeHtml(meta)}</div>
            </div>
            <div class="rank__wins"><b>${value.number}</b><span>${value.unit}</span></div>
          </div>`;
        })
        .join('');
    }

    /** 지난 퀴즈 — 문제와 정답, 그리고 가장 먼저 맞힌 사람 */
    function renderQuizHistory(history) {
      if (!history.length) return stateArt('empty','기록장이 비어 있어요.','퀴즈를 마치면 여기에 기록돼요.');

      return history
        .map((h) => {
          const setter = h.setter ? ` · 출제 ${personChip(h.setter)}` : '';
          // 맞힌 순서대로 — 가장 먼저 맞힌 사람 앞에는 트로피를 붙인다
          const solvers = h.entries
            .map((e) => `${e.isWinner ? '🏆 ' : ''}${personChip(e)} ${escapeHtml(e.scoreText)}`)
            .join(' · ');

          return `<div class="history-item">
            <div class="history-item__head">
              <span class="history-item__date">
                <span class="tag tag--mode">${h.modeIcon} ${escapeHtml(h.modeLabel)}${
                  h.timeLimitLabel ? ` ${escapeHtml(h.timeLimitLabel)}` : ''
                }</span>
                <span class="tag">${escapeHtml(h.answerTypeLabel)}</span>
                ${escapeHtml(roundLabel(h.roundNo))}${setter}
              </span>
              <span class="history-item__answer">${escapeHtml(h.answer)}</span>
            </div>
            <div class="history-item__question">${escapeHtml(h.question)}</div>
            <div class="history-item__winners">${
              solvers || '아무도 맞히지 못했어요'
            }</div>
          </div>`;
        })
        .join('');
    }

    function renderHistory(history) {
      if (!history.length) return stateArt('empty','기록장이 비어 있어요.','한 판을 마치면 여기에 기록돼요.');

      return history
        .map((h) => {
          const voided = h.status !== 'settled';
          const head = voided ? '게임 없음' : escapeHtml(roundLabel(h.roundNo));
          // 합산으로 볼 때는 어느 게임이었는지 표시한다
          const badge = scope ? '' : `<span class="tag">${escapeHtml(h.game.short)}</span> `;
          // 출제자와 1등은 프로필 사진까지 함께 보여 준다
          const setter = h.setter ? ` · 출제 ${personChip(h.setter)}` : '';
          const top = h.entries.filter((e) => e.isWinner).map((e) => personChip(e));
          const scored = h.entries
            .filter((e) => e.score > 0)
            .map((e) => `${e.displayName} ${e.scoreText}`);

          return `<div class="history-item${voided ? ' history-item--void' : ''}">
            <div class="history-item__head">
              <span class="history-item__date">
                ${badge}${escapeHtml(formatShortDate(h.date))} · ${head}${setter}
              </span>
              <span class="history-item__answer">${voided ? '—' : escapeHtml(h.answer)}</span>
            </div>
            <div class="history-item__winners">${
              voided
                ? '정답이 기록되지 않아 회차로 세지 않았어요.'
                : top.length
                  ? `🏆 ${top.join(', ')}${
                      scored.length ? ` · ${escapeHtml(scored.join(' / '))}` : ''
                    }`
                  : '참가자 없음'
            }</div>
          </div>`;
        })
        .join('');
    }

    async function load() {
      const query = scope ? `?game=${scope}` : '';
      const isQuiz = scope === QUIZ.key;
      const game = PARTY[scope] ?? (isQuiz ? QUIZ : GAMES[scope]);

      el.rankingLabel.textContent = game ? `순위 · ${game.label}` : '순위 · 다섯 게임 합산';
      el.subtitle.textContent = PARTY[scope] ? `${game.label}의 누적 점수 순이에요.` : isQuiz
        ? '가장 먼저 맞힌 횟수를 보여 줍니다. 순위는 점수 합계 순이에요.'
        : game
          ? `${game.title} 기록만 셉니다. 1등 횟수를 보여 주고, 순위는 점수 합계 순이에요.`
          : '다섯 게임의 점수를 모두 합쳐서 셉니다.';

      el.historyLabel.textContent = isQuiz
        ? '지난 퀴즈'
        : scope ? '지난 회차' : '지난 회차 · 오전 · 오후';

      // 퀴즈는 날짜로 나뉘지 않아서 지난 기록도 따로 가져온다
      const historyPath = PARTY[scope] ? `/api/party/history${query}` : isQuiz ? '/api/quiz/history' : `/api/history${query}`;

      // 네트워크가 끊겨도 스켈레톤만 남지 않도록 실패를 화면에 보여 준다
      try {
        const [{ ranking }, { history }] = await Promise.all([
          api(`/api/ranking${query}`),
          api(historyPath),
        ]);
        const me = ranking.find(r => r.id === user.id);
        setHtml(document.getElementById('my-rank'), me ? `<div class="arcade-result"><div class="card__label">MY RANK</div><div class="arcade-result__hero"><div><strong>${ranking.filter(r=>r.rank===me.rank).length>1?'공동 ':''}${me.rank}<small>위</small></strong><p>${escapeHtml(user.displayName)} · ${me.score}점</p></div>${illustration('rank')}</div></div>` : '');
        setHtml(el.ranking, renderRanking(ranking));
        setHtml(el.history, PARTY[scope] ? renderPartyHistory(history,scope) : isQuiz ? renderQuizHistory(history) : renderHistory(history));
      } catch (err) {
        const msg = `<p class="muted center">불러오지 못했습니다.<br />${escapeHtml(err.message)}</p>`;
        setHtml(el.ranking, msg);
        setHtml(el.history, msg);
      }
    }

    el.scope.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-scope]');
      if (!btn || btn.dataset.scope === scope) return;
      scope = btn.dataset.scope;
      for (const item of el.scope.querySelectorAll('[data-scope]')) {
        item.setAttribute('aria-selected', String(item.dataset.scope === scope));
      }
      playOnce(btn, 'is-picked');
      load();
    });

    await load();
    // 첫 화면만 위 칸부터 차례로 올라온다
    revealChildren(document.querySelector('.app'));
  </script>
</body>
</html>
