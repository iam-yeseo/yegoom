<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>정답 등록 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      정답 등록
      <span id="subtitle">운영자 전용</span>
    </h1>

    <p id="msg" class="msg hidden" role="alert"></p>

    <section class="card">
      <div class="card__label">오늘 실제 퇴근한 시간</div>
      <input id="answer-input" class="time-input" type="time" step="60" value="18:00"
             aria-label="정답 퇴근시간" />
      <div class="chips" id="chips"></div>
      <button id="reveal" class="btn" type="button" style="margin-top: 12px">
        정답 공개하기
      </button>
      <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
        공개하면 오차와 우승자가 바로 확정되고, 모든 참가자에게 예측이 공개됩니다.
      </p>
    </section>

    <section id="revealed-box" class="card hidden">
      <div class="card__label">공개 상태</div>
      <p id="revealed-text" style="margin: 0 0 14px"></p>
      <div class="btn-row">
        <button id="recalc" class="btn btn--ghost" type="button">정답 수정</button>
        <button id="cancel" class="btn btn--danger" type="button">공개 취소</button>
      </div>
      <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
        공개를 취소해도 참가자들의 예측은 지워지지 않습니다.
      </p>
    </section>

    <section class="card">
      <div class="card__label">오늘 제출 현황</div>
      <div id="players"><div class="skeleton"></div></div>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      api, escapeHtml, initial, renderTabbar, requireLogin, showMessage, startClock,
    } from '/js/common.js';

    const QUICK_PICKS = ['17:30', '18:00', '18:30', '19:00', '20:00', '21:00'];

    const el = {
      subtitle: document.getElementById('subtitle'),
      msg: document.getElementById('msg'),
      input: document.getElementById('answer-input'),
      chips: document.getElementById('chips'),
      reveal: document.getElementById('reveal'),
      revealedBox: document.getElementById('revealed-box'),
      revealedText: document.getElementById('revealed-text'),
      recalc: document.getElementById('recalc'),
      cancel: document.getElementById('cancel'),
      players: document.getElementById('players'),
    };

    startClock();
    const user = await requireLogin({ adminOnly: true });
    renderTabbar(user);

    el.chips.innerHTML = QUICK_PICKS.map(
      (t) => `<button class="chip" type="button" data-time="${t}" aria-pressed="false">${t}</button>`,
    ).join('');
    el.chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      el.input.value = chip.dataset.time;
      syncChips();
    });
    el.input.addEventListener('input', syncChips);

    function syncChips() {
      for (const chip of el.chips.querySelectorAll('.chip')) {
        chip.setAttribute('aria-pressed', String(chip.dataset.time === el.input.value));
      }
    }

    async function submitAnswer(confirmText) {
      const time = el.input.value;
      if (!time) return showMessage(el.msg, '정답 시간을 골라 주세요.');
      if (confirmText && !confirm(confirmText.replace('{time}', time))) return;

      el.reveal.disabled = true;
      try {
        const res = await api('/api/admin/answer', { method: 'POST', body: { time } });
        showMessage(el.msg, `정답 ${res.answer} 공개 완료 · 참가자 ${res.participants}명`, 'ok');
        await load();
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.reveal.disabled = false;
      }
    }

    el.reveal.addEventListener('click', () =>
      submitAnswer('오늘의 정답을 {time} 로 공개할까요? 공개하면 예측이 모두 드러납니다.'),
    );
    el.recalc.addEventListener('click', () =>
      submitAnswer('정답을 {time} 로 바꾸고 우승자를 다시 계산할까요?'),
    );

    el.cancel.addEventListener('click', async () => {
      if (!confirm('오늘의 정답 공개를 취소할까요? 우승 기록도 함께 되돌아갑니다.')) return;
      el.cancel.disabled = true;
      try {
        await api('/api/admin/answer', { method: 'DELETE' });
        showMessage(el.msg, '공개를 취소했습니다. 참가자들이 다시 예측할 수 있어요.', 'ok');
        await load();
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.cancel.disabled = false;
      }
    });

    async function load() {
      const state = await api('/api/today');
      const submitted = state.players.filter((p) => p.submitted).length;

      el.subtitle.textContent = state.revealed
        ? '정답 공개됨'
        : `${submitted}/${state.players.length}명 제출 · 공개 대기 중`;

      el.revealedBox.classList.toggle('hidden', !state.revealed);
      el.reveal.classList.toggle('hidden', state.revealed);

      if (state.revealed) {
        el.input.value = state.answer;
        const winners = state.players.filter((p) => p.isWinner).map((p) => p.displayName);
        el.revealedText.innerHTML = `오늘의 정답은 <b>${escapeHtml(state.answer)}</b> 입니다.<br />
          우승 · ${winners.length ? escapeHtml(winners.join(', ')) : '없음'}`;
      }
      syncChips();

      el.players.innerHTML = state.players
        .map((p) => {
          const meta = state.revealed
            ? (p.submitted ? `${p.guess} · ${p.diffText}` : '예측 없음')
            : (p.submitted ? '제출 완료 🔒' : '아직 제출 전');
          const value = state.revealed ? (p.isWinner ? '🏆' : '') : (p.submitted ? '✅' : '⏳');
          return `<div class="player${p.isWinner ? ' player--winner' : ''}">
            <div class="player__avatar" aria-hidden="true">${initial(p.displayName)}</div>
            <div class="player__body">
              <div class="player__name">${escapeHtml(p.displayName)}</div>
              <div class="player__meta">${escapeHtml(meta)} · 누적 ${p.totalWins}승</div>
            </div>
            <div class="player__value">${value}</div>
          </div>`;
        })
        .join('');
    }

    await load();
  </script>
</body>
</html>
