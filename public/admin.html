<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>운영 · 기상 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <h1 class="page-title">
      운영
      <span>오늘의 두 게임 현황 · 운영자 전용</span>
    </h1>

    <p id="msg" class="msg hidden" role="alert"></p>

    <section class="card">
      <div class="card__label">정답은 출제자가 넣습니다</div>
      <p class="muted" style="margin: 0; font-size: 14px">
        오전 게임은 출제자가 <b>기상했어요</b> 버튼을 누른 시각이, 오후 게임은 출제자가 적어 둔
        시각이 정답이 됩니다. 정답을 기록했는지 여부는 <b>운영자에게도 보이지 않습니다.</b>
        여기서는 잘못 공개된 회차를 되돌리고, 출제자를 바꿀 수 있습니다.
      </p>
    </section>

    <div id="games">
      <div class="card"><div class="skeleton"></div></div>
    </div>

    <section class="card">
      <div class="card__label">출제자</div>
      <p class="muted" style="margin: 0 0 12px; font-size: 14px">
        게임마다 한 명씩 지정합니다. 출제자는 자기 게임에만 빠지고, 다른 게임에는 평범한
        플레이어로 참가합니다.
      </p>
      <a class="btn btn--ghost" href="/setup">출제자 바꾸기</a>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      GAMES, api, avatarOf, escapeHtml, renderTabbar, requireLogin, roundLabel, showMessage,
      startClock,
    } from '/js/common.js';

    const el = {
      msg: document.getElementById('msg'),
      games: document.getElementById('games'),
    };

    startClock();
    const user = await requireLogin({ adminOnly: true });
    renderTabbar(user);

    function playerRow(p, state) {
      const meta = state.revealed
        ? (p.submitted ? `${p.guess} · ${p.diffText} · ${p.scoreText}` : '예측 없음')
        : (p.submitted ? '확정 완료 🔒' : state.closed ? '예측 없음' : '아직 확정 전');
      const value = state.revealed ? (p.isWinner ? '🏆' : '') : (p.submitted ? '✅' : '⏳');
      return `<div class="player${p.isWinner ? ' player--winner' : ''}">
        <div class="player__avatar" aria-hidden="true">${avatarOf(p)}</div>
        <div class="player__body">
          <div class="player__name">${escapeHtml(p.displayName)}</div>
          <div class="player__meta">${escapeHtml(meta)} · 누적 ${p.totalScore}점</div>
        </div>
        <div class="player__value">${value}</div>
      </div>`;
    }

    function gameCard(state) {
      const game = state.game;
      const note = state.revealed ? '정답 공개' : state.closed ? '마감됨' : `${state.closesAt} 마감`;

      let summary;
      if (state.revealed) {
        const winners = state.players.filter((p) => p.isWinner).map((p) => p.displayName);
        summary = `정답 <b>${escapeHtml(state.answer)}</b> · 1등 ${
          winners.length ? escapeHtml(winners.join(', ')) : '없음'
        }`;
      } else if (state.status === 'void') {
        summary = '정답 없이 끝났습니다 (게임 없음). 회차는 올라가지 않아요.';
      } else {
        summary = `${state.submitted}/${state.players.length}명 확정 · 출제자가 공개하기를 기다리는 중`;
      }

      return `<section class="card">
        <div class="card__label">${game.icon} ${escapeHtml(game.label)} · ${escapeHtml(game.title)}</div>

        <div class="round-line">
          <span class="round-badge">${escapeHtml(roundLabel(state.roundNo))}</span>
          <span class="round-line__note">${escapeHtml(note)}</span>
        </div>

        <p style="margin: 0 0 12px">${summary}</p>

        <div class="profile-preview" style="margin-bottom: 14px; padding-bottom: 14px">
          <div class="profile-preview__avatar" aria-hidden="true">${
            state.setter ? avatarOf(state.setter) : '🙂'
          }</div>
          <div>
            <div class="profile-preview__name">${
              state.setter ? escapeHtml(state.setter.displayName) : '출제자 없음'
            }</div>
            <div class="muted" style="font-size: 13px">${
              state.setter
                ? `이 사람의 ${escapeHtml(game.subject)}을 맞히는 게임입니다.`
                : '지정해야 게임이 시작됩니다.'
            }</div>
          </div>
        </div>

        ${
          state.revealed
            ? `<button class="btn btn--danger" type="button" data-cancel="${game.key}">
                 공개 취소
               </button>
               <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
                 취소해도 참가자들의 예측과 출제자가 기록해 둔 정답은 지워지지 않습니다.
               </p>`
            : ''
        }

        <div style="margin-top: 14px">${state.players.map((p) => playerRow(p, state)).join('')}</div>
      </section>`;
    }

    async function load() {
      const states = await Promise.all(
        Object.keys(GAMES).map((key) => api(`/api/today?game=${key}`)),
      );
      el.games.innerHTML = states.map(gameCard).join('');
    }

    el.games.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-cancel]');
      if (!btn) return;
      const game = GAMES[btn.dataset.cancel];
      if (!confirm(`${game.label}의 정답 공개를 취소할까요? 점수 기록도 함께 되돌아갑니다.`)) return;

      btn.disabled = true;
      showMessage(el.msg, '');
      try {
        await api(`/api/admin/round?game=${game.key}`, { method: 'DELETE' });
        showMessage(el.msg, `${game.label}의 공개를 취소했습니다.`, 'ok');
      } catch (err) {
        showMessage(el.msg, err.message);
      }
      await load().catch(() => {});
    });

    try {
      await load();
    } catch (err) {
      showMessage(el.msg, `불러오지 못했습니다: ${err.message}`);
      el.games.innerHTML = '<p class="muted center">잠시 후 다시 시도해 주세요.</p>';
    }
  </script>
</body>
</html>
