<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1020" />
  <title>정답 등록 · 퇴근시간 맞히기</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕕</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="clock">
      <div class="clock__date" data-clock-date>&nbsp;</div>
      <div class="clock__time" data-clock-time>--:--</div>
    </header>

    <div class="round-line">
      <span class="round-badge" id="round-badge">1회차</span>
      <span class="round-line__note" id="round-note">19:00 마감</span>
    </div>

    <h1 class="page-title">
      정답 등록
      <span id="subtitle">운영자 전용</span>
    </h1>

    <p id="msg" class="msg hidden" role="alert"></p>

    <section class="card">
      <div class="card__label" id="answer-label">오늘 실제 퇴근한 시간 · 초까지</div>
      <div id="answer-input"></div>
      <button id="reveal" class="btn" type="button" style="margin-top: 12px">
        정답 공개하기
      </button>
      <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
        공개하면 오차와 점수가 바로 확정되고, 회차가 하나 올라갑니다.
      </p>
    </section>

    <section class="card">
      <div class="card__label">출제자</div>
      <div class="profile-preview" id="setter-profile" style="margin-bottom: 14px; padding-bottom: 14px">
        <div class="profile-preview__avatar" id="setter-avatar" aria-hidden="true">🙂</div>
        <div>
          <div class="profile-preview__name" id="setter-name">&nbsp;</div>
          <div class="muted" style="font-size: 13px" id="setter-text">불러오는 중…</div>
        </div>
      </div>
      <a class="btn btn--ghost" href="/setup">출제자 바꾸기</a>
    </section>

    <section id="revealed-box" class="card hidden">
      <div class="card__label">공개 상태</div>
      <p id="revealed-text" style="margin: 0 0 14px"></p>
      <div class="btn-row">
        <button id="recalc" class="btn btn--ghost" type="button">정답 수정</button>
        <button id="cancel" class="btn btn--danger" type="button">공개 취소</button>
      </div>
      <p class="muted center" style="font-size: 13px; margin: 10px 0 0">
        공개를 취소해도 참가자들의 예측은 지워지지 않습니다.
      </p>
    </section>

    <section id="void-box" class="card hidden">
      <div class="card__label">마감</div>
      <p style="margin: 0" id="void-text"></p>
    </section>

    <section class="card">
      <div class="card__label">오늘 확정 현황</div>
      <div id="players"><div class="skeleton"></div></div>
    </section>
  </div>

  <nav class="tabbar" data-tabbar aria-label="주요 메뉴"></nav>

  <script type="module">
    import {
      api, avatarOf, escapeHtml, renderTabbar, requireLogin, roundLabel, showMessage, startClock,
    } from '/js/common.js';
    import { createTimeInput } from '/js/time-input.js';

    const el = {
      roundBadge: document.getElementById('round-badge'),
      roundNote: document.getElementById('round-note'),
      subtitle: document.getElementById('subtitle'),
      msg: document.getElementById('msg'),
      answerLabel: document.getElementById('answer-label'),
      setterProfile: document.getElementById('setter-profile'),
      setterAvatar: document.getElementById('setter-avatar'),
      setterName: document.getElementById('setter-name'),
      setterText: document.getElementById('setter-text'),
      reveal: document.getElementById('reveal'),
      revealedBox: document.getElementById('revealed-box'),
      revealedText: document.getElementById('revealed-text'),
      recalc: document.getElementById('recalc'),
      cancel: document.getElementById('cancel'),
      voidBox: document.getElementById('void-box'),
      voidText: document.getElementById('void-text'),
      players: document.getElementById('players'),
    };

    startClock();
    const user = await requireLogin({ adminOnly: true });
    renderTabbar(user);

    // 정답도 초까지 받아야 해서 예측 화면과 같은 키패드 입력칸을 쓴다
    const answerInput = createTimeInput(document.getElementById('answer-input'), {
      value: '18:00:00',
      label: '정답 퇴근시간',
    });

    async function submitAnswer(confirmText) {
      const time = answerInput.value;
      if (!time) return showMessage(el.msg, '정답 시간을 입력해 주세요.');
      if (confirmText && !confirm(confirmText.replace('{time}', time))) return;

      el.reveal.disabled = true;
      try {
        const res = await api('/api/admin/answer', { method: 'POST', body: { time } });
        showMessage(
          el.msg,
          `${roundLabel(res.roundNo)} 정답 ${res.answer} 공개 완료 · 참가자 ${res.participants}명`,
          'ok',
        );
        await load();
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.reveal.disabled = false;
      }
    }

    el.reveal.addEventListener('click', () =>
      submitAnswer('오늘의 정답을 {time} 로 공개할까요? 공개하면 예측이 모두 드러납니다.'),
    );
    el.recalc.addEventListener('click', () =>
      submitAnswer('정답을 {time} 로 바꾸고 점수를 다시 계산할까요?'),
    );

    el.cancel.addEventListener('click', async () => {
      if (!confirm('오늘의 정답 공개를 취소할까요? 점수 기록도 함께 되돌아갑니다.')) return;
      el.cancel.disabled = true;
      try {
        await api('/api/admin/answer', { method: 'DELETE' });
        showMessage(el.msg, '공개를 취소했습니다.', 'ok');
        await load();
      } catch (err) {
        showMessage(el.msg, err.message);
      } finally {
        el.cancel.disabled = false;
      }
    });

    async function load() {
      const state = await api('/api/today');
      const submitted = state.players.filter((p) => p.submitted).length;

      el.roundBadge.textContent = roundLabel(state.roundNo);
      el.roundNote.textContent = state.revealed
        ? '정답 공개'
        : state.closed ? '마감됨' : `${state.closesAt} 마감`;

      el.subtitle.textContent = state.revealed
        ? '정답 공개됨'
        : `${submitted}/${state.players.length}명 확정 · 공개 대기 중`;

      // 출제자는 사진과 함께 보여 준다 (누구 퇴근시간을 적는 건지 헷갈리지 않게)
      el.setterProfile.classList.toggle('hidden', !state.setter);
      if (state.setter) {
        el.setterAvatar.innerHTML = avatarOf(state.setter);
        el.setterName.textContent = state.setter.displayName;
      }
      el.answerLabel.textContent = state.setter
        ? `${state.setter.displayName} 님이 실제 퇴근한 시간 · 초까지`
        : '오늘 실제 퇴근한 시간 · 초까지';
      el.setterText.textContent = state.setter
        ? '이 사람의 퇴근시간을 맞히는 게임입니다.'
        : '아직 출제자가 지정되지 않았습니다. 지정해야 게임이 시작됩니다.';

      el.revealedBox.classList.toggle('hidden', !state.revealed);
      el.reveal.classList.toggle('hidden', state.revealed);

      const pendingVoid = !state.revealed && state.status === 'void';
      el.voidBox.classList.toggle('hidden', !pendingVoid);
      if (pendingVoid) {
        el.voidText.textContent = state.isToday
          ? `${state.closesAt} 이 지나 예측은 마감됐습니다. 지금 정답을 등록하면 ${roundLabel(state.roundNo)} 로 확정되고, 그냥 두면 오늘은 '게임 없음' 으로 남습니다.`
          : "정답 없이 끝난 날입니다 (게임 없음).";
      }

      if (state.revealed) {
        answerInput.value = state.answer;
        const winners = state.players.filter((p) => p.isWinner).map((p) => p.displayName);
        el.revealedText.innerHTML = `${escapeHtml(roundLabel(state.roundNo))} 정답은
          <b>${escapeHtml(state.answer)}</b> 입니다.<br />
          1등 · ${winners.length ? escapeHtml(winners.join(', ')) : '없음'}`;
      }

      el.players.innerHTML = state.players
        .map((p) => {
          const meta = state.revealed
            ? (p.submitted ? `${p.guess} · ${p.diffText} · ${p.scoreText}` : '예측 없음')
            : (p.submitted ? '확정 완료 🔒' : state.closed ? '예측 없음' : '아직 확정 전');
          const value = state.revealed ? (p.isWinner ? '🏆' : '') : (p.submitted ? '✅' : '⏳');
          return `<div class="player${p.isWinner ? ' player--winner' : ''}">
            <div class="player__avatar" aria-hidden="true">${avatarOf(p)}</div>
            <div class="player__body">
              <div class="player__name">${escapeHtml(p.displayName)}</div>
              <div class="player__meta">${escapeHtml(meta)} · 누적 ${p.totalScore}점</div>
            </div>
            <div class="player__value">${value}</div>
          </div>`;
        })
        .join('');
    }

    await load();
  </script>
</body>
</html>
